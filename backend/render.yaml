services:
  - type: web
    name: manas-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://zykzsfqeamnowjwyukbr.supabase.co
      - key: SUPABASE_KEY
        sync: false
    healthCheckPath: /health
